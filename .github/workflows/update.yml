name: Update PCE data & deploy

on:
  schedule:
    # 14:20 UTC daily = 09:20 ET in summer, 10:20 ET in winter — comfortably past the
    # 08:30 ET release time that both BEA (Personal Income and Outlays, which carries
    # the PCE price indexes and the underlying detail) and BLS (CPI) use. Deliberately
    # off the hour: jobs scheduled at :00 queue behind everyone else's and get delayed.
    #
    # Daily rather than "around release day" because release dates move, revisions land
    # off-cycle, the Dallas Fed republishes the trimmed mean whenever BEA revises, and
    # seasonal factors get recomputed each year. A run that finds nothing new writes
    # byte-identical files and makes no commit.
    - cron: '20 14 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # committing refreshed data
  pages: write
  id-token: write

# Never let two deployments race; let a running one finish rather than cancelling it
# mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # No dependencies to install — both scripts are plain Node.

      # Cheap, needs no BEA key, and fails loudly if the Dallas Fed changes the shape of
      # its workbooks — which would otherwise surface as a silently wrong distribution.
      - name: Self-test the trimmed-mean arithmetic
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/selftest.mjs --fresh

      # Must run first: fetch-data.mjs merges data/distribution.json into the payload
      # the site loads. --strict fails the run rather than committing a distribution
      # whose component mapping broke or that no longer tracks the published window.
      - name: Rebuild the component distribution from BEA
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/build-distribution.mjs --fresh --strict

      - name: Fetch latest PCE and CPI data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional. Unset -> the script falls back to the keyless BLS v1 API.
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        # --strict: fail rather than commit a build that lost a series (e.g. an expired
        # key silently dropping the sticky lines and recession bands).
        run: node scripts/fetch-data.mjs --fresh --strict

      - name: Commit if the numbers changed
        run: |
          if git diff --quiet -- data/pce.json data/distribution.json public/data.js; then
            echo "No change — nothing new was published since the last run."
            exit 0
          fi
          latest=$(node -p "require('./data/pce.json').latestMonth")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pce.json data/distribution.json public/data.js
          git commit -m "data: refresh through ${latest}"
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
